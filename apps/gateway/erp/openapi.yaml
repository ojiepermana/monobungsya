openapi: 3.0.3
info:
  title: Project Public API
  description: Public HTTP contract exposed by the API Gateway.
  version: 0.1.0
tags:
  - name: Health
    description: Gateway health checks
  - name: Auth
    description: Public auth boundary
  - name: Users
    description: Public users boundary
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check gateway health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /api/v1/auth/status:
    get:
      tags:
        - Auth
      summary: Forward auth status request
      operationId: getApiV1AuthStatus
  /api/v1/auth/magic-link:
    post:
      tags:
        - Auth
      summary: Request an auth magic link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
      operationId: postApiV1AuthMagic-link
  /api/v1/auth/verify:
    get:
      tags:
        - Auth
      summary: Consume an auth magic link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            minLength: 20
            maxLength: 512
            type: string
      operationId: getApiV1AuthVerify
  /api/v1/auth/session:
    get:
      tags:
        - Auth
      summary: Read the current auth session
      operationId: getApiV1AuthSession
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout the current auth session
      operationId: postApiV1AuthLogout
  /api/v1/users/status:
    get:
      tags:
        - Users
      summary: Forward users status request
      operationId: getApiV1UsersStatus
components:
  schemas: {}
