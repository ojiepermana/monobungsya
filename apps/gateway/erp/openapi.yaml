openapi: 3.0.3
info:
  title: Project Public API
  description: Public HTTP contract exposed by the API Gateway.
  version: 0.1.0
tags:
  - name: Health
    description: Gateway health checks
  - name: Auth
    description: Public auth boundary
  - name: Passkey
    description: Public passkey (WebAuthn) boundary
  - name: Users
    description: Public users boundary
  - name: Logs
    description: Public log viewer boundary
  - name: Access
    description: Public permission access boundary
  - name: Jobs
    description: Authorized job operations boundary
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check gateway health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /api/v1/auth/status:
    get:
      tags:
        - Auth
      summary: Forward auth status request
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: auth
                    type: string
      operationId: getApiV1AuthStatus
  /api/v1/auth/magic-link:
    post:
      tags:
        - Auth
      summary: Request an auth magic link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
                desktop:
                  const: true
                  type: boolean
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
                desktop:
                  const: true
                  type: boolean
          multipart/form-data:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
                desktop:
                  const: true
                  type: boolean
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    const: true
                    type: boolean
      operationId: postApiV1AuthMagic-link
  /api/v1/auth/verify:
    get:
      tags:
        - Auth
      summary: Consume an auth magic link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            minLength: 20
            maxLength: 512
            type: string
      operationId: getApiV1AuthVerify
  /api/v1/auth/session:
    get:
      tags:
        - Auth
      summary: Read the current auth session
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                  sessionObservation:
                    type: object
                    required:
                      - state
                      - reason
                    properties:
                      state:
                        type: string
                        enum:
                          - authenticated
                          - anonymous
                          - invalid
                      reason:
                        anyOf:
                          - const: missing_cookie
                            type: string
                          - const: unknown_session
                            type: string
                          - const: revoked
                            type: string
                          - const: absolute_expired
                            type: string
                          - const: idle_expired
                            type: string
                          - const: user_missing
                            type: string
                          - const: user_deleted
                            type: string
                          - const: user_blocked
                            type: string
                          - const: user_suspended
                            type: string
                          - type: "null"
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                      - permissions
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                  session:
                    type: object
                    required:
                      - id
                      - idleExpiresAt
                      - absoluteExpiresAt
                    properties:
                      id:
                        type: string
                      idleExpiresAt:
                        type: string
                      absoluteExpiresAt:
                        type: string
      operationId: getApiV1AuthSession
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout the current auth session
      responses:
        "204":
          description: Response for status 204
          content:
            type: void
      operationId: postApiV1AuthLogout
  /api/v1/auth/passkey/register/options:
    post:
      tags:
        - Passkey
      summary: Start passkey registration
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                patternProperties:
                  ^(.*)$: {}
      operationId: postApiV1AuthPasskeyRegisterOptions
  /api/v1/auth/passkey/register/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - label
                  - createdAt
                  - lastUsedAt
                  - backupState
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  createdAt:
                    type: string
                  lastUsedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  backupState:
                    type: boolean
      operationId: postApiV1AuthPasskeyRegisterVerify
  /api/v1/auth/passkey/login/options:
    post:
      tags:
        - Passkey
      summary: Start passkey sign in
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                patternProperties:
                  ^(.*)$: {}
      operationId: postApiV1AuthPasskeyLoginOptions
  /api/v1/auth/passkey/login/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                  mfaRequired:
                    type: boolean
                  purpose:
                    type: string
                    enum:
                      - login
                      - enroll
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                  session:
                    type: object
                    required:
                      - id
                      - idleExpiresAt
                      - absoluteExpiresAt
                    properties:
                      id:
                        type: string
                      idleExpiresAt:
                        type: string
                      absoluteExpiresAt:
                        type: string
      operationId: postApiV1AuthPasskeyLoginVerify
  /api/v1/auth/passkeys:
    get:
      tags:
        - Passkey
      summary: List the current user's passkeys
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - passkeys
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - label
                        - createdAt
                        - lastUsedAt
                        - backupState
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        createdAt:
                          type: string
                        lastUsedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        backupState:
                          type: boolean
      operationId: getApiV1AuthPasskeys
  /api/v1/auth/passkeys/{id}:
    patch:
      tags:
        - Passkey
      summary: Rename a passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - label
                  - createdAt
                  - lastUsedAt
                  - backupState
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  createdAt:
                    type: string
                  lastUsedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  backupState:
                    type: boolean
      operationId: patchApiV1AuthPasskeysById
    delete:
      tags:
        - Passkey
      summary: Delete a passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: Response for status 204
          content:
            type: void
      operationId: deleteApiV1AuthPasskeysById
  /api/v1/auth/2fa/enroll:
    post:
      tags:
        - Auth
      summary: Start TOTP enrollment
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - otpauthUri
                properties:
                  secret:
                    type: string
                  otpauthUri:
                    type: string
      operationId: postApiV1Auth2faEnroll
  /api/v1/auth/2fa/enroll/confirm:
    post:
      tags:
        - Auth
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
      operationId: postApiV1Auth2faEnrollConfirm
  /api/v1/auth/2fa/verify:
    post:
      tags:
        - Auth
      summary: Verify a TOTP login challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                  - redirectTo
                properties:
                  authenticated:
                    const: true
                    type: boolean
                  redirectTo:
                    type: string
      operationId: postApiV1Auth2faVerify
  /api/v1/auth/2fa/status:
    get:
      tags:
        - Auth
      summary: Read the current TOTP status
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - confirmedAt
                  - required
                  - recoveryCodesRemaining
                properties:
                  enabled:
                    type: boolean
                  confirmedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  required:
                    type: boolean
                  recoveryCodesRemaining:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
      operationId: getApiV1Auth2faStatus
  /api/v1/auth/2fa/disable:
    post:
      tags:
        - Auth
      summary: Disable TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
                recoveryCode:
                  minLength: 8
                  maxLength: 32
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    const: true
                    type: boolean
      operationId: postApiV1Auth2faDisable
  /api/v1/auth/2fa/recovery-codes:
    post:
      tags:
        - Auth
      summary: Regenerate TOTP recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  pattern: ^[0-9]{6}$
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - recoveryCodes
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
      operationId: postApiV1Auth2faRecovery-codes
  /api/v1/auth/admin/users/{id}/2fa:
    get:
      tags:
        - Auth
      summary: Read a user TOTP status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - confirmedAt
                  - required
                  - recoveryCodesRemaining
                properties:
                  enabled:
                    type: boolean
                  confirmedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  required:
                    type: boolean
                  recoveryCodesRemaining:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
      operationId: getApiV1AuthAdminUsersById2fa
  /api/v1/auth/admin/users/{id}/2fa/reset:
    post:
      tags:
        - Auth
      summary: Reset a user TOTP credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  minLength: 3
                  maxLength: 500
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  minLength: 3
                  maxLength: 500
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  minLength: 3
                  maxLength: 500
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    const: true
                    type: boolean
      operationId: postApiV1AuthAdminUsersById2faReset
  /api/v1/users/status:
    get:
      tags:
        - Users
      summary: Forward users status request
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: users
                    type: string
      operationId: getApiV1UsersStatus
  /api/v1/users:
    get:
      tags:
        - Users
      summary: List users (requires user:user:list)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                  - options
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - email
                        - status
                        - emailVerifiedAt
                        - suspendedAt
                        - blockedAt
                        - deletedAt
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - suspended
                            - blocked
                            - deleted
                        emailVerifiedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        suspendedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        blockedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        deletedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        createdAt:
                          type: string
                        updatedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                  meta:
                    type: object
                    required:
                      - page
                      - perPage
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      perPage:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - status
