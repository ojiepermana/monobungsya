openapi: 3.0.3
info:
  title: Access Service API
  description: Permission catalog and direct user grants.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Access
    description: Permission and grant management
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check access health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /api/v1/access/permissions:
    get:
      tags:
        - Access
      summary: List the permission catalog
      parameters:
        - name: page
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: search
          in: query
          required: false
          schema:
            maxLength: 255
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            maxLength: 50
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - code
                        - namespace
                        - resource
                        - action
                        - scope
                        - description
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        code:
                          type: string
                        namespace:
                          type: string
                        resource:
                          type: string
                        action:
                          type: string
                        scope:
                          anyOf:
                            - type: string
                            - type: "null"
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        grantCount:
                          anyOf:
                            - format: integer
                              default: 0
                              type: string
                            - type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  meta:
                    type: object
                    required:
                      - page
                      - pageSize
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      pageSize:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - namespace
                    properties:
                      search:
                        type: string
                      namespace:
                        type: string
      operationId: getApiV1AccessPermissions
    post:
      tags:
        - Access
      summary: Create a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: postApiV1AccessPermissions
  /api/v1/access/permissions/{id}:
    get:
      tags:
        - Access
      summary: Read a permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: getApiV1AccessPermissionsById
    put:
      tags:
        - Access
      summary: Update a permission description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          multipart/form-data:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: putApiV1AccessPermissionsById
    delete:
      tags:
        - Access
      summary: Delete a permission and its grants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AccessPermissionsById
  /api/v1/access/users/{userId}/permissions:
    get:
      tags:
        - Access
      summary: List a user permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - permissionId
                    - userId
                    - permission
                    - createdAt
                  properties:
                    id:
                      format: uuid
                      type: string
                    permissionId:
                      format: uuid
                      type: string
                    userId:
                      format: uuid
                      type: string
                    permission:
                      type: object
                      required:
                        - id
                        - name
                        - code
                        - namespace
                        - resource
                        - action
                        - scope
                        - description
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        code:
                          type: string
                        namespace:
                          type: string
                        resource:
                          type: string
                        action:
                          type: string
                        scope:
                          anyOf:
                            - type: string
                            - type: "null"
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        grantCount:
                          anyOf:
                            - format: integer
                              default: 0
                              type: string
                            - type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                    createdAt:
                      type: string
      operationId: getApiV1AccessUsersByUserIdPermissions
    post:
      tags:
        - Access
      summary: Grant permissions to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - granted
                  - skipped
                properties:
                  granted:
                    type: array
                    items:
                      format: uuid
                      type: string
                  skipped:
                    type: array
                    items:
                      format: uuid
                      type: string
      operationId: postApiV1AccessUsersByUserIdPermissions
  /api/v1/access/users/{userId}/permissions/copy:
    post:
      tags:
        - Access
      summary: Copy permissions from another user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceUserId
              properties:
                sourceUserId:
                  format: uuid
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - sourceUserId
              properties:
                sourceUserId:
                  format: uuid
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - sourceUserId
              properties:
                sourceUserId:
                  format: uuid
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - granted
                  - skipped
                properties:
                  granted:
                    type: array
                    items:
                      format: uuid
                      type: string
                  skipped:
                    type: array
                    items:
                      format: uuid
                      type: string
      operationId: postApiV1AccessUsersByUserIdPermissionsCopy
  /api/v1/access/users/{userId}/permissions/{permissionId}:
    delete:
      tags:
        - Access
      summary: Revoke a user permission
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            format: uuid
            type: string
        - name: permissionId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AccessUsersByUserIdPermissionsByPermissionId
components:
  schemas: {}
