openapi: 3.0.3
info:
  title: Access Service API
  description: Permission catalog and direct user grants.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Access
    description: Permission and grant management
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check access health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /api/v1/access/permissions:
    get:
      tags:
        - Access
      summary: List the permission catalog
      parameters:
        - name: page
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: search
          in: query
          required: false
          schema:
            maxLength: 255
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            maxLength: 50
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - code
                        - namespace
                        - resource
                        - action
                        - scope
                        - description
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        code:
                          type: string
                        namespace:
                          type: string
                        resource:
                          type: string
                        action:
                          type: string
                        scope:
                          anyOf:
                            - type: string
                            - type: "null"
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        grantCount:
                          anyOf:
                            - format: integer
                              default: 0
                              type: string
                            - type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  meta:
                    type: object
                    required:
                      - page
                      - pageSize
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      pageSize:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - namespace
                    properties:
                      search:
                        type: string
                      namespace:
                        type: string
      operationId: getApiV1AccessPermissions
    post:
      tags:
        - Access
      summary: Create a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 5
                  maxLength: 100
                  pattern: ^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*){2,3}$
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: postApiV1AccessPermissions
  /api/v1/access/permissions/{id}:
    get:
      tags:
        - Access
      summary: Read a permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: getApiV1AccessPermissionsById
    put:
      tags:
        - Access
      summary: Update a permission description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
          multipart/form-data:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - code
                  - namespace
                  - resource
                  - action
                  - scope
                  - description
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  code:
                    type: string
                  namespace:
                    type: string
                  resource:
                    type: string
                  action:
                    type: string
                  scope:
                    anyOf:
                      - type: string
                      - type: "null"
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  grantCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
      operationId: putApiV1AccessPermissionsById
    delete:
      tags:
        - Access
      summary: Delete a permission and its grants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AccessPermissionsById
  /api/v1/access/groups:
    get:
      tags:
        - Access
      summary: List permission groups
      parameters:
        - name: page
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
        - name: search
          in: query
          required: false
          schema:
            maxLength: 255
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - off
        - name: deleted
          in: query
          required: false
          schema:
            type: string
            enum:
              - exclude
              - include
              - only
        - name: appliable
          in: query
          required: false
          schema:
            pattern: ^(true|false)$
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - status
                        - description
                        - permissionCount
                        - createdAt
                        - updatedAt
                        - deletedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - off
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        permissionCount:
                          anyOf:
                            - format: integer
                              default: 0
                              type: string
                            - type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        deletedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                  meta:
                    type: object
                    required:
                      - page
                      - pageSize
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      pageSize:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - status
                      - deleted
                      - appliable
                    properties:
                      search:
                        type: string
                      status:
                        type: string
                      deleted:
                        type: string
                        enum:
                          - exclude
                          - include
                          - only
                      appliable:
                        type: boolean
      operationId: getApiV1AccessGroups
    post:
      tags:
        - Access
      summary: Create a permission group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - status
                  - description
                  - permissionCount
                  - createdAt
                  - updatedAt
                  - deletedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - off
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  permissionCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  deletedAt:
                    anyOf:
                      - type: string
                      - type: "null"
      operationId: postApiV1AccessGroups
  /api/v1/access/groups/{id}:
    get:
      tags:
        - Access
      summary: Read a permission group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - status
                  - description
                  - permissionCount
                  - createdAt
                  - updatedAt
                  - deletedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - off
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  permissionCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  deletedAt:
                    anyOf:
                      - type: string
                      - type: "null"
      operationId: getApiV1AccessGroupsById
    put:
      tags:
        - Access
      summary: Update a permission group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  minLength: 1
                  maxLength: 100
                  type: string
                description:
                  anyOf:
                    - maxLength: 2000
                      type: string
                    - type: "null"
                status:
                  type: string
                  enum:
                    - active
                    - off
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - status
                  - description
                  - permissionCount
                  - createdAt
                  - updatedAt
                  - deletedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - off
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  permissionCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  deletedAt:
                    anyOf:
                      - type: string
                      - type: "null"
      operationId: putApiV1AccessGroupsById
    delete:
      tags:
        - Access
      summary: Soft delete a permission group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AccessGroupsById
  /api/v1/access/groups/{id}/restore:
    post:
      tags:
        - Access
      summary: Restore a permission group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - status
                  - description
                  - permissionCount
                  - createdAt
                  - updatedAt
                  - deletedAt
                properties:
                  id:
                    format: uuid
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - active
                      - off
                  description:
                    anyOf:
                      - type: string
                      - type: "null"
                  permissionCount:
                    anyOf:
                      - format: integer
                        default: 0
                        type: string
                      - type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  deletedAt:
                    anyOf:
                      - type: string
                      - type: "null"
      operationId: postApiV1AccessGroupsByIdRestore
  /api/v1/access/groups/{id}/permissions:
    get:
      tags:
        - Access
      summary: List group permissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - code
                    - namespace
                    - resource
                    - action
                    - scope
                    - description
                    - createdAt
                    - updatedAt
                  properties:
                    id:
                      format: uuid
                      type: string
                    name:
                      type: string
                    code:
                      type: string
                    namespace:
                      type: string
                    resource:
                      type: string
                    action:
                      type: string
                    scope:
                      anyOf:
                        - type: string
                        - type: "null"
                    description:
                      anyOf:
                        - type: string
                        - type: "null"
                    grantCount:
                      anyOf:
                        - format: integer
                          default: 0
                          type: string
                        - type: integer
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
      operationId: getApiV1AccessGroupsByIdPermissions
    post:
      tags:
        - Access
      summary: Attach permissions to a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    format: uuid
                    type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - attached
                  - skipped
                properties:
                  attached:
                    type: array
                    items:
                      format: uuid
                      type: string
                  skipped:
                    type: array
                    items:
                      format: uuid
                      type: string
      operationId: postApiV1AccessGroupsByIdPermissions
  /api/v1/access/groups/{id}/permissions/{permissionId}:
    delete:
      tags:
        - Access
      summary: Detach a permission from a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
        - name: permissionId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AccessGroupsByIdPermissionsByPermissionId
  /api/v1/access/groups/{id}/apply:
    post:
      tags:
        - Access
      summary: Apply a permission group to users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userIds
              properties:
                userIds:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    format: uuid
                    type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - userIds
              properties:
                userIds:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    format: uuid
                    type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - userIds
              properties:
                userIds:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    format: uuid
                    type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - applied
                  - failed
                properties:
                  applied:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - granted
                        - skipped
                      properties:
                        userId:
                          format: uuid
                          type: string
                        granted:
                          type: array
                          items:
                            format: uuid
                            type: string
                        skipped:
                          type: array
                          items:
                            format: uuid
                            type: string
                  failed:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - reason
                      properties:
                        userId:
                          format: uuid
                          type: string
                        reason:
                          type: string
      operationId: postApiV1AccessGroupsByIdApply
  /api/v1/access/users/{userId}/permissions:
    get:
      tags:
        - Access
      summary: List a user permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - permissionId
                    - userId
                    - permission
                    - createdAt
                  properties:
                    id:
                      format: uuid
                      type: string
                    permissionId:
                      format: uuid
                      type: string
                    userId:
                      format: uuid
                      type: string
                    permission:
                      type: object
                      required:
                        - id
                        - name
                        - code
                        - namespace
                        - resource
                        - action
                        - scope
                        - description
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        code:
                          type: string
                        namespace:
                          type: string
                        resource:
                          type: string
                        action:
                          type: string
                        scope:
                          anyOf:
                            - type: string
                            - type: "null"
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        grantCount:
                          anyOf:
                            - format: integer
                              default: 0
                              type: string
