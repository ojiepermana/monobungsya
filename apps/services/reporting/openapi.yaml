openapi: 3.0.3
info:
  title: Reporting Service API
  description: Internal HTTP contract for the reporting service.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Reports
    description: Reporting module
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /internal/reports/status:
    get:
      tags:
        - Reports
      summary: Return reports module status
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: reports
                    type: string
      operationId: getInternalReportsStatus
components:
  schemas: {}
