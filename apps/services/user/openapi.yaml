openapi: 3.0.3
info:
  title: User Service API
  description: Internal HTTP contract for the user service.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Users
    description: User module
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /internal/users/status:
    get:
      tags:
        - Users
      summary: Return users module status
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: users
                    type: string
      operationId: getInternalUsersStatus
components:
  schemas: {}
