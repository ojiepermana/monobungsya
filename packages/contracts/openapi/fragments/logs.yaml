openapi: 3.0.3
info:
  title: Logs Service API
  description: Internal HTTP contract for the read only logs service.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Logs
    description: Log viewer module
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /internal/logs/audit-trails:
    get:
      tags:
        - Logs
      summary: List audit trails with filters and paging
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: actorUserId
          in: query
          required: false
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                  - options
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - action
                        - module
                        - entityType
                        - entityId
                        - entityLabel
                        - actorEmail
                        - actorRole
                        - changeSummary
                        - auditedAt
                      properties:
                        id:
                          type: string
                        action:
                          type: string
                        module:
                          type: string
                        entityType:
                          type: string
                        entityId:
                          type: string
                        entityLabel:
                          anyOf:
                            - type: string
                            - type: "null"
                        actorEmail:
                          anyOf:
                            - type: string
                            - type: "null"
                        actorRole:
                          anyOf:
                            - type: string
                            - type: "null"
                        changeSummary:
                          anyOf:
                            - type: string
                            - type: "null"
                        auditedAt:
                          type: string
                  meta:
                    type: object
                    required:
                      - page
                      - perPage
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      perPage:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - module
                      - action
                    properties:
                      search:
                        type: string
                      module:
                        type: string
                      action:
                        type: string
                  options:
                    type: object
                    required:
                      - modules
                      - actions
                    properties:
                      modules:
                        type: array
                        items:
                          type: string
                      actions:
                        type: array
                        items:
                          type: string
      operationId: getInternalLogsAudit-trails
components:
  schemas: {}
