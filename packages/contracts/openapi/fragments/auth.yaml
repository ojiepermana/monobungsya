openapi: 3.0.3
info:
  title: Auth Service API
  description: Internal HTTP contract for the auth service.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Auth module
  - name: Passkey
    description: Passkey (WebAuthn) sign in
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /internal/auth/status:
    get:
      tags:
        - Auth
      summary: Return auth module status
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: auth
                    type: string
      operationId: getInternalAuthStatus
  /internal/auth/magic-link:
    post:
      tags:
        - Auth
      summary: Request a passwordless sign in link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    const: true
                    type: boolean
      operationId: postInternalAuthMagic-link
  /internal/auth/verify:
    get:
      tags:
        - Auth
      summary: Consume a passwordless sign in link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            minLength: 20
            maxLength: 512
            type: string
      operationId: getInternalAuthVerify
  /internal/auth/session:
    get:
      tags:
        - Auth
      summary: Return the current browser session
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                  sessionObservation:
                    type: object
                    required:
                      - state
                      - reason
                      - role
                      - permissionCount
                    properties:
                      state:
                        type: string
                        enum:
                          - authenticated
                          - anonymous
                          - invalid
                      reason:
                        anyOf:
                          - const: missing_cookie
                            type: string
                          - const: unknown_session
                            type: string
                          - const: revoked
                            type: string
                          - const: absolute_expired
                            type: string
                          - const: idle_expired
                            type: string
                          - const: user_missing
                            type: string
                          - const: user_deleted
                            type: string
                          - const: user_blocked
                            type: string
                          - const: user_suspended
                            type: string
                          - type: "null"
                      role:
                        anyOf:
                          - type: string
                          - type: "null"
                      permissionCount:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                      - role
                      - permissions
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                  session:
                    type: object
                    required:
                      - id
                      - idleExpiresAt
                      - absoluteExpiresAt
                    properties:
                      id:
                        type: string
                      idleExpiresAt:
                        type: string
                      absoluteExpiresAt:
                        type: string
      operationId: getInternalAuthSession
  /internal/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current browser session
      operationId: postInternalAuthLogout
  /internal/auth/passkey/register/options:
    post:
      tags:
        - Passkey
      summary: Start passkey registration for the signed in user
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                patternProperties:
                  ^(.*)$: {}
      operationId: postInternalAuthPasskeyRegisterOptions
  /internal/auth/passkey/register/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - label
                  - createdAt
                  - lastUsedAt
                  - backupState
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  createdAt:
                    type: string
                  lastUsedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  backupState:
                    type: boolean
      operationId: postInternalAuthPasskeyRegisterVerify
  /internal/auth/passkey/login/options:
    post:
      tags:
        - Passkey
      summary: Start passkey sign in
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                patternProperties:
                  ^(.*)$: {}
      operationId: postInternalAuthPasskeyLoginOptions
  /internal/auth/passkey/login/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey sign in and open a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                  - user
                  - session
                properties:
                  authenticated:
                    const: true
                    type: boolean
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                      - role
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                  session:
                    type: object
                    required:
                      - id
                      - idleExpiresAt
                      - absoluteExpiresAt
                    properties:
                      id:
                        type: string
                      idleExpiresAt:
                        type: string
                      absoluteExpiresAt:
                        type: string
      operationId: postInternalAuthPasskeyLoginVerify
  /internal/auth/passkeys:
    get:
      tags:
        - Passkey
      summary: List the signed in user's passkeys
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - passkeys
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - label
                        - createdAt
                        - lastUsedAt
                        - backupState
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        createdAt:
                          type: string
                        lastUsedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        backupState:
                          type: boolean
      operationId: getInternalAuthPasskeys
  /internal/auth/passkeys/{id}:
    patch:
      tags:
        - Passkey
      summary: Rename one of the signed in user's passkeys
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - label
                  - createdAt
                  - lastUsedAt
                  - backupState
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  createdAt:
                    type: string
                  lastUsedAt:
                    anyOf:
                      - type: string
                      - type: "null"
                  backupState:
                    type: boolean
      operationId: patchInternalAuthPasskeysById
    delete:
      tags:
        - Passkey
      summary: Delete one of the signed in user's passkeys
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteInternalAuthPasskeysById
components:
  schemas: {}
