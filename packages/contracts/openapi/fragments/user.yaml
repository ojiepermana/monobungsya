              required:
                - id
                - name
                - email
                - role
              properties:
                id:
                  format: uuid
                  type: string
                name:
                  minLength: 1
                  maxLength: 255
                  type: string
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
                role:
                  type: string
                  enum:
                    - admin
                    - manager
                    - bi
                    - staff
                    - legacy
      responses:
        "200":
