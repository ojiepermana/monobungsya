openapi: 3.0.3
info:
  title: User Service API
  description: Internal HTTP contract for the user service.
  version: 0.1.0
tags:
  - name: Health
    description: Service health checks
  - name: Users
    description: User module
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /internal/users/status:
    get:
      tags:
        - Users
      summary: Return users module status
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                  - module
                properties:
                  service:
                    type: string
                  status:
                    const: ok
                    type: string
                  module:
                    const: users
                    type: string
      operationId: getInternalUsersStatus
  /internal/users:
    get:
      tags:
        - Users
      summary: List users with search, status filter, and paging
      parameters:
        - name: search
          in: query
          required: false
          schema:
            maxLength: 255
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ""
              - active
              - suspended
              - blocked
              - deleted
              - all
        - name: page
          in: query
          required: false
          schema:
            maxLength: 8
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - filters
                  - options
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - email
                        - role
                        - status
                        - emailVerifiedAt
                        - suspendedAt
                        - blockedAt
                        - deletedAt
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          format: uuid
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                            - admin
                            - manager
                            - bi
                            - staff
                            - legacy
                        status:
                          type: string
                          enum:
                            - active
                            - suspended
                            - blocked
                            - deleted
                        emailVerifiedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        suspendedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        blockedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        deletedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                        createdAt:
                          type: string
                        updatedAt:
                          anyOf:
                            - type: string
                            - type: "null"
                  meta:
                    type: object
                    required:
                      - page
                      - perPage
                      - total
                      - totalPages
                    properties:
                      page:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      perPage:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      total:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                      totalPages:
                        anyOf:
                          - format: integer
                            default: 0
                            type: string
                          - type: integer
                  filters:
                    type: object
                    required:
                      - search
                      - status
                    properties:
                      search:
                        type: string
                      status:
                        type: string
                        enum:
                          - ""
                          - active
                          - suspended
                          - blocked
                          - deleted
                          - all
                  options:
                    type: object
                    required:
                      - roles
                      - statuses
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                          enum:
                            - admin
                            - manager
                            - bi
                            - staff
                            - legacy
                      statuses:
                        type: array
                        items:
                          type: string
                          enum:
                            - active
                            - suspended
                            - blocked
                            - deleted
      operationId: getInternalUsers
    post:
      tags:
        - Users
      summary: Create a user with a client generated UUIDv7 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
                - email
                - role
              properties:
                id:
                  format: uuid
                  type: string
                name:
                  minLength: 1
                  maxLength: 255
                  type: string
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
                role:
                  type: string
                  enum:
                    - admin
                    - manager
                    - bi
                    - staff
                    - legacy
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - id
                - name
                - email
                - role
              properties:
                id:
