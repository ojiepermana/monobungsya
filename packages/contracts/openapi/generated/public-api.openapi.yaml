openapi: 3.0.3
info:
  title: Project Public API
  description: Public HTTP contract exposed by the API Gateway.
  version: 0.1.0
tags:
  - name: Health
    description: Gateway health checks
  - name: Auth
    description: Public auth boundary
  - name: Passkey
    description: Public passkey (WebAuthn) boundary
  - name: Users
    description: Public users boundary
  - name: Logs
    description: Public log viewer boundary
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check gateway health
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    const: ok
                    type: string
                  service:
                    type: string
      operationId: getHealth
  /api/v1/auth/status:
    get:
      tags:
        - Auth
      summary: Forward auth status request
      operationId: getApiV1AuthStatus
  /api/v1/auth/magic-link:
    post:
      tags:
        - Auth
      summary: Request an auth magic link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  format: email
                  minLength: 3
                  maxLength: 255
                  type: string
      operationId: postApiV1AuthMagic-link
  /api/v1/auth/users:
    get:
      tags:
        - Auth
      summary: List users for authorized operators
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      operationId: getApiV1AuthUsers
  /api/v1/auth/verify:
    get:
      tags:
        - Auth
      summary: Consume an auth magic link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            minLength: 20
            maxLength: 512
            type: string
      operationId: getApiV1AuthVerify
  /api/v1/auth/session:
    get:
      tags:
        - Auth
      summary: Read the current auth session
      operationId: getApiV1AuthSession
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout the current auth session
      operationId: postApiV1AuthLogout
  /api/v1/auth/passkey/register/options:
    post:
      tags:
        - Passkey
      summary: Start passkey registration
      operationId: postApiV1AuthPasskeyRegisterOptions
  /api/v1/auth/passkey/register/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      operationId: postApiV1AuthPasskeyRegisterVerify
  /api/v1/auth/passkey/login/options:
    post:
      tags:
        - Passkey
      summary: Start passkey sign in
      operationId: postApiV1AuthPasskeyLoginOptions
  /api/v1/auth/passkey/login/verify:
    post:
      tags:
        - Passkey
      summary: Finish passkey sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  additionalProperties: true
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                  properties:
                    id:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    rawId:
                      minLength: 1
                      maxLength: 1024
                      type: string
                    type:
                      minLength: 1
                      maxLength: 32
                      type: string
                    response:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    clientExtensionResults:
                      type: object
                      patternProperties:
                        ^(.*)$: {}
                    authenticatorAttachment:
                      maxLength: 32
                      type: string
      operationId: postApiV1AuthPasskeyLoginVerify
  /api/v1/auth/passkeys:
    get:
      tags:
        - Passkey
      summary: List the current user's passkeys
      operationId: getApiV1AuthPasskeys
  /api/v1/auth/passkeys/{id}:
    patch:
      tags:
        - Passkey
      summary: Rename a passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  minLength: 1
                  maxLength: 100
                  type: string
      operationId: patchApiV1AuthPasskeysById
    delete:
      tags:
        - Passkey
      summary: Delete a passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: uuid
            type: string
      operationId: deleteApiV1AuthPasskeysById
  /api/v1/users/status:
    get:
      tags:
        - Users
      summary: Forward users status request
      operationId: getApiV1UsersStatus
  /api/v1/logs/audit-trails:
    get:
      tags:
        - Logs
      summary: List audit trails (requires logs.read)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
      operationId: getApiV1LogsAudit-trails
  /api/v1/logs/access-logs:
    get:
      tags:
        - Logs
      summary: List access logs (requires logs.read)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
      operationId: getApiV1LogsAccess-logs
  /api/v1/logs/application-logs:
    get:
      tags:
        - Logs
      summary: List application logs (requires logs.read)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
      operationId: getApiV1LogsApplication-logs
components:
  schemas: {}
