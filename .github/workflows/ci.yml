name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/project
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_MIGRATION_URL: postgres://project_migrator:ci-migrator@localhost:5432/project
      DATABASE_RESET_ALLOWED: true
      DATABASE_TIMEZONE: Asia/Jakarta
      NODE_ENV: test
      OBSERVABILITY_INGESTION_URL: ${{ secrets.OBSERVABILITY_INGESTION_URL }}
      OBSERVABILITY_INGESTION_KEY_ID: ${{ secrets.OBSERVABILITY_INGESTION_KEY_ID }}
      OBSERVABILITY_INGESTION_SECRET: ${{ secrets.OBSERVABILITY_INGESTION_SECRET }}
      BENCHMARK_HTTP_URL: ${{ secrets.BENCHMARK_HTTP_URL }}
      BENCHMARK_JOURNEY_STEPS: ${{ secrets.BENCHMARK_JOURNEY_STEPS }}
      BENCHMARK_STAGING_CREATE_COMMAND: ${{ secrets.BENCHMARK_STAGING_CREATE_COMMAND }}
      BENCHMARK_STAGING_DESTROY_COMMAND: ${{ secrets.BENCHMARK_STAGING_DESTROY_COMMAND }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test workflow progress tooling
        run: bun run test:progress

      - name: Check workflow drift
        run: bun run progress:check

      - name: Provision ephemeral database roles
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_migrator') THEN
              CREATE ROLE project_migrator LOGIN PASSWORD 'ci-migrator';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_auth_runtime') THEN
              CREATE ROLE project_auth_runtime NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_user_runtime') THEN
              CREATE ROLE project_user_runtime NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_logs_writer') THEN
              CREATE ROLE project_logs_writer NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_access_runtime') THEN
              CREATE ROLE project_access_runtime NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_jobs_runtime') THEN
              CREATE ROLE project_jobs_runtime NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_notification_runtime') THEN
              CREATE ROLE project_notification_runtime NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_telemetry_writer') THEN
              CREATE ROLE project_telemetry_writer NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'project_telemetry_reader') THEN
              CREATE ROLE project_telemetry_reader NOLOGIN;
            END IF;
          END
          $$;
          GRANT CONNECT, CREATE ON DATABASE project TO project_migrator;
          GRANT project_logs_writer TO project_migrator;
          \connect project
          GRANT USAGE, CREATE ON SCHEMA public TO project_migrator;
          SQL

      - name: Run database reset and seed
        run: bun run db:reset --confirm --seed

      - name: Run database idempotence check
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Run tests
        run: bun run test

      - name: Run web tests
        run: bun run test:web

      - name: Run typecheck
        run: bun run typecheck

      - name: Check observability standard
        run: bun run check:observability

      - name: Run observability benchmark contract
        run: >-
          bun run observability:benchmark -- --warmup 10 --iterations 100 --groups 5
          --baseline benchmarks/baselines/runtime-telemetry-core.json
          --output /tmp/observability-benchmark.json
          --markdown /tmp/observability-benchmark.md

      - name: Upload observability benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: observability-benchmark-${{ github.sha }}
          path: |
            /tmp/observability-benchmark.json
            /tmp/observability-benchmark.md

      - name: Ingest observability benchmark projection
        if: ${{ env.OBSERVABILITY_INGESTION_URL != '' && env.OBSERVABILITY_INGESTION_KEY_ID != '' && env.OBSERVABILITY_INGESTION_SECRET != '' }}
        run: bun run observability:benchmark:ingest -- --input /tmp/observability-benchmark.json

      - name: Run full observability benchmark suite
        if: ${{ github.event_name == 'schedule' || github.event_name == 'release' }}
        run: >-
          bun run observability:benchmark:suite -- --full --require-staging --warmup 10 --iterations 100 --groups 5
          --output-dir /tmp/observability-benchmark-suite

      - name: Upload full observability benchmark artifacts
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: observability-benchmark-suite-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            /tmp/observability-benchmark-suite/*.json
            /tmp/observability-benchmark-suite/*.md

      - name: Run lint
        run: bun run lint

      - name: Validate dependency boundaries
        run: bun run check:dependencies

      - name: Generate OpenAPI and SDK
        run: bun run openapi:generate

      - name: Validate OpenAPI
        run: bun run openapi:validate

      - name: Check generated artifacts
        run: git diff --exit-code -- 'apps/**/openapi.yaml' packages/contracts/openapi packages/angular-sdk/src/generated

      - name: Build applications
        run: bun run build

  container-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and Docker build inputs for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: infra/docker/web/Dockerfile
            build_args: ""
          - name: gateway
            file: infra/docker/gateway/Dockerfile
            build_args: ""
          - name: auth
            file: infra/docker/services/auth/Dockerfile
            build_args: ""
          - name: user
            file: infra/docker/services/user/Dockerfile
            build_args: ""
          - name: logs
            file: infra/docker/services/logs/Dockerfile
            build_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for supported platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            monobungsia/${{ matrix.name }}:${{ github.sha }}
            monobungsia/${{ matrix.name }}:${{ github.event.release.tag_name || github.sha }}
          build-args: ${{ matrix.build_args }}
